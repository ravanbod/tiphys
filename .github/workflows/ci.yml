# Same checks as the project's GitLab pipeline: backend (build, vet, tests
# with a throwaway PostgreSQL for the integration tests), frontend
# (typecheck, lint, unit tests, build) and the container image (built, not
# pushed).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tiphys-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "psql -U postgres -tAc 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/postgresql/data
    env:
      TIPHYS_TEST_DATABASE_URL: postgres://postgres:tiphys-test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -count=1 ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tiphys:ci .
