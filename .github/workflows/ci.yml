# Same checks as the project's GitLab pipeline: backend (build, vet, tests
# with a throwaway PostgreSQL for the integration tests), frontend
# (typecheck, lint, unit tests, build) and the container image.
#
# The image is pushed to Docker Hub on pushes to main (tags `main` and
# `sha-<short>`) and on `v*` tags (`1.2.3`, `1.2`, `latest`), once backend and
# frontend passed; pull requests only build it. On `v*` tags the Helm charts
# (deploy/chart/*) are pushed too, as OCI artifacts next to the image
# (oci://registry-1.docker.io/<DOCKERHUB_USERNAME>/tiphys-portal and
# .../tiphys-connector), with the tag's version. Pushing needs the repository
# variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN (a Docker Hub
# access token with read & write); the variable DOCKERHUB_IMAGE overrides the
# image name (default <DOCKERHUB_USERNAME>/tiphys). Without the token the
# image is only built.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: tiphys-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "psql -U postgres -tAc 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
          --tmpfs /var/lib/postgresql/data
    env:
      TIPHYS_TEST_DATABASE_URL: postgres://postgres:tiphys-test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -count=1 ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || (vars.DOCKERHUB_USERNAME && format('{0}/tiphys', vars.DOCKERHUB_USERNAME)) || 'tiphys' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  charts:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/chart/tiphys-connector
          helm lint deploy/chart/tiphys-portal --set env.PUBLIC_URL=https://tiphys.example.com
          helm template t deploy/chart/tiphys-connector > /dev/null
          helm template t deploy/chart/tiphys-portal --set env.PUBLIC_URL=https://tiphys.example.com \
            --set ingress.enabled=true --set serviceMonitor.enabled=true > /dev/null
      - if: env.PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          for chart in tiphys-portal tiphys-connector; do
            helm package "deploy/chart/$chart" --version "$version" --app-version "$version" -d dist
            helm push "dist/$chart-$version.tgz" "oci://registry-1.docker.io/$DOCKERHUB_USERNAME"
          done
