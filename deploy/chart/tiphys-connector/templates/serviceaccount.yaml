apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Long-lived token for the portal's kubeconfig. Rotation: create a second
# token Secret, replace the credential in the portal, delete the old one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.serviceAccountName }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.serviceAccountName }}
type: kubernetes.io/service-account-token
