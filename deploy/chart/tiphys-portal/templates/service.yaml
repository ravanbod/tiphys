apiVersion: v1
kind: Service
metadata:
  name: {{ include "tiphys-portal.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tiphys-portal.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
    - {name: metrics, port: {{ .Values.service.metricsPort }}, targetPort: metrics}
