apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys-portal.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Clusters are registered by Secrets annotated `tiphys/cluster: <name>` in this
# namespace. The portal only reads them: it never writes or deletes Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tiphys-portal-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys-portal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tiphys-portal-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tiphys-portal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tiphys-portal-credentials
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
