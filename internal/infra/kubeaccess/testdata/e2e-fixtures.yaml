apiVersion: v1
kind: Namespace
metadata: {name: e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: e2e}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","while true; do echo hello-from-web; sleep 5; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: other, namespace: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: other}}
  template:
    metadata: {labels: {app: other}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: e2e}
spec:
  replicas: 1
  serviceName: db
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: agent, namespace: e2e}
spec:
  selector: {matchLabels: {app: agent}}
  template:
    metadata: {labels: {app: agent}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: report, namespace: e2e}
spec:
  schedule: "0 3 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels: {team: data}
      annotations: {note: from-template}
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: job
            image: busybox:1.36
            command: ["sh","-c","echo running; sleep 20; echo done"]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: quick, namespace: e2e}
spec:
  schedule: "0 3 1 1 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: job
            image: busybox:1.36
            command: ["sh","-c","echo quick"]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: canary, namespace: e2e}
spec:
  replicas: 1
  selector: {matchLabels: {app: canary}}
  strategy: {canary: {steps: [{setWeight: 50}]}}
  template:
    metadata: {labels: {app: canary}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","sleep 100000"]
